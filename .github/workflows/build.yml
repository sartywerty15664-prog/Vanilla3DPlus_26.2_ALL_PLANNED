name: Build Vanilla 3D+

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle build --no-daemon

      - name: Verify JAR
        run: |
          ls -lh build/libs/
          test -f build/libs/vanilla_3d_plus-1.0.0.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Vanilla-3D-Plus-26.2
          path: build/libs/vanilla_3d_plus-1.0.0.jar
          if-no-files-found: error
